<div class="modal" id="addDrugModal">
    <div class="modal-background"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title">Add a New Drug</p>
            <button class="delete" aria-label="close"></button>
        </header>

        <section class="modal-card-body">
            <form method="POST" action="{{ url_for('drugs.manage_drugs') }}" id="drug-form" aria-label="drug-form">
                <div class="field is-horizontal">
                    <div class="field-label is-normal"><label class="label">SKU</label></div>
                    <div class="field-body">
                        <input class="input" type="text" name="sku" id="sku_input" required readonly>
                    </div>
                </div>

                <div class="field is-horizontal">
                    <div class="field-label is-normal"><label class="label">Drug Name</label></div>
                    <div class="field-body">
                        <input class="input" type="text" name="name" id="drug_name_input" required>
                        <p class="help is-danger" id="nameWarning" style="display:none;"></p>
                    </div>
                </div>


                <div class="field is-horizontal">
                    <div class="field-label is-normal"><label class="label">Sell Price</label></div>
                    <div class="field-body">
                        <input class="input" type="number" step="0.01" name="sell_price">
                    </div>
                </div>

                <div class="field is-horizontal">
                    <div class="field-label is-normal"><label class="label">Cost</label></div>
                    <div class="field-body">
                        <input class="input" type="number" step="0.01" name="buy_price">
                    </div>
                </div>

                <div class="field is-horizontal">
                    <div class="field-label is-normal"><label class="label">Stock</label></div>
                    <div class="field-body">
                        <input class="input" type="number" name="quantity">
                    </div>
                </div>
            </form>
        </section>

        <footer class="modal-card-foot">
            <button class="button is-success" type="submit" form="drug-form">Add Drug</button>
            <button class="button" id="closeAddNewDrugModalBtn">Cancel</button>
        </footer>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const drugNameInput = document.getElementById('drug_name_input');
        const warning = document.getElementById('nameWarning');
        const form = document.getElementById('drug-form');
        const sellPriceInput = document.querySelector('input[name="sell_price"]');

        let cachedDrugs = null;   // in-memory cache
        let similarDrug = null;   // store last match

        // --- Fetch once and cache ---
        async function loadDrugs() {
            if (!cachedDrugs) {
                const response = await fetch('/api/drugs');
                cachedDrugs = await response.json();
            }
            return cachedDrugs;
        }

        // --- Modal Control ---
        const modal = document.getElementById('addDrugModal');
        const openBtn = document.getElementById('addDrugModalBtn');
        const closeBtn = modal.querySelector('.delete');
        const cancelBtn = document.getElementById('closeAddNewDrugModalBtn');

        function openModal() { modal.classList.add('is-active'); }
        function closeModal() { modal.classList.remove('is-active'); }

        if (openBtn) openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        // --- Auto SKU Generation ---
        const skuInput = document.getElementById('sku_input');

        drugNameInput.addEventListener('blur', function () {
            const name = this.value.trim();
            if (name.length >= 3) {
                const prefix = name.substring(0, 3).toUpperCase();
                const uuid = crypto.randomUUID();
                const uuidPart = uuid.replace(/-/g, '').substring(0, 10);
                skuInput.value = `${prefix}-${uuidPart}`;
            }
        });


        /**
       * Calculates the Levenshtein distance between two strings.
       * This is the "helper" function that does the core calculation.
       */
        function levenshteinDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();

            const m = s1.length;
            const n = s2.length;

            // Create a 2D array (matrix)
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(null));

            // Initialize the first row and column
            for (let i = 0; i <= m; i++) {
                dp[i][0] = i; // Distance from "abc" to "" is 3 deletions
            }
            for (let j = 0; j <= n; j++) {
                dp[0][j] = j; // Distance from "" to "abc" is 3 insertions
            }

            // Fill the rest of the matrix
            for (let j = 1; j <= n; j++) {
                for (let i = 1; i <= m; i++) {
                    const cost = s1[i - 1] === s2[j - 1] ? 0 : 1; // 0 if chars match, 1 if not

                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,    // Deletion
                        dp[i][j - 1] + 1,    // Insertion
                        dp[i - 1][j - 1] + cost // Substitution
                    );
                }
            }

            // The final distance is in the bottom-right corner
            return dp[m][n];
        }

        /**
         * Calculates a similarity percentage (0.0 to 1.0) based on Levenshtein distance.
         * This is the function your event listener will call.
         */
        function similarity(s1, s2) {
            if (!s1 || !s2) return 0;

            const longerLength = Math.max(s1.length, s2.length);
            if (longerLength === 0) {
                return 1.0; // Both strings are empty
            }

            const distance = levenshteinDistance(s1, s2);

            // Normalize the distance to a similarity score
            return (longerLength - distance) / longerLength;
        }

        // --- Blur check: show warning text ---
        drugNameInput.addEventListener('blur', async function () {
            const name = this.value.trim().toLowerCase();
            if (!name) {
                warning.style.display = "none";
                similarDrug = null;
                return;
            }

            const drugs = await loadDrugs();

            let bestMatch = null;
            let bestScore = 0;

            for (let d of drugs) {
                const score = similarity(name, d.name);
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = d;
                }
            }

            if (bestScore >= 0.8) {
                warning.textContent = `⚠️ A similar drug "${bestMatch.name}" already exists (${Math.round(bestScore * 100)}% match).`;
                warning.style.display = "block";
                similarDrug = bestMatch;
            } else {
                warning.style.display = "none";
                similarDrug = null;
            }
        });

        // --- Submit check: confirm before sending ---
        form.addEventListener('submit', function (e) {
            if (similarDrug) {
                e.preventDefault();
                const newName = drugNameInput.value.trim();
                const newPrice = sellPriceInput.value;
                const message = `A similar drug already exists:\n\n` +
                    `Existing: ${similarDrug.name} - ${similarDrug.sell_price}\n` +
                    `New: ${newName} - ${newPrice}\n\n` +
                    `Do you want to add this new drug anyway?`;
                if (confirm(message)) {
                    form.submit();
                } else {
                    drugNameInput.focus();
                }
            }
        });
    });
</script>
