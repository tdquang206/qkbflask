<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - QKBFlask</title>
    <!-- Simple Bulma CSS for styling as requested/used in project -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bulma.css') }}">
</head>

<body>
    <section class="hero is-fullheight">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-5-tablet is-4-desktop is-3-widescreen">
                        <form method="POST" class="box">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                            <h3 class="title has-text-centered">Login</h3>

                            {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                            {% for category, message in messages %}
                            <div class="notification is-{{ category if category != 'error' else 'danger' }}">
                                {{ message }}
                            </div>
                            {% endfor %}
                            {% endif %}
                            {% endwith %}

                            <div class="field">
                                <label class="label">Username</label>
                                <div class="control">
                                    <input class="input" type="text" name="username" placeholder="Username" required
                                        autofocus>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Password</label>
                                <div class="control">
                                    <input class="input" type="password" name="password" placeholder="Password"
                                        required>
                                </div>
                            </div>

                            <div class="field">
                                <button class="button is-success is-fullwidth">
                                    Login
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
