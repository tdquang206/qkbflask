{% extends 'base.html' %}
{% block content %}
<h1 class="title">Đổi mật khẩu</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label class="label">Mật khẩu hiện tại</label><input class="input" type="password" name="current_password" autocomplete="current-password" required></div>
  <div class="field"><label class="label">Mật khẩu mới (ít nhất 12 ký tự)</label><input class="input" type="password" name="new_password" minlength="12" autocomplete="new-password" required></div>
  <div class="field"><label class="label">Xác nhận mật khẩu mới</label><input class="input" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></div>
  <button class="button is-primary">Đổi mật khẩu</button>
</form>
{% endblock %}
